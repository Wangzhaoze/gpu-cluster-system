name: gpu-lab-poc
x-app-env: &app-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  LAB_HOST_ROOT: ${LAB_HOST_ROOT}
  LAB_RUNTIME_ROOT: /runtime
  DATASET_HOST_PATH: ${DATASET_HOST_PATH}
  LAB_BASE_IMAGE: ${LAB_BASE_IMAGE}
  LAB_TORCH_IMAGE: ${LAB_TORCH_IMAGE:-lab-torch-dev:2.7.1-cu128}
  LAB_SHM_SIZE: ${LAB_SHM_SIZE:-2g}
  SCHEDULER_BACKEND: ${SCHEDULER_BACKEND:-mock-docker}
  MOCK_GPU_COUNT: ${MOCK_GPU_COUNT:-5}
  LOCAL_GPU_COUNT: ${LOCAL_GPU_COUNT:-1}
  LAB_HOST_EDITOR_ENABLED: ${LAB_HOST_EDITOR_ENABLED:-false}
  LAB_HOST_EDITOR_USER: ${LAB_HOST_EDITOR_USER:-local}
  LAB_HOST_EDITOR_HOME: ${LAB_HOST_EDITOR_HOME:-/home/local}
  LAB_HOST_EDITOR_UID: ${LAB_HOST_EDITOR_UID:-1000}
  LAB_HOST_EDITOR_GID: ${LAB_HOST_EDITOR_GID:-1000}
  LAB_HOST_EDITOR_PYTHON: ${LAB_HOST_EDITOR_PYTHON:-/usr/bin/python3}

services:
  postgres:
    image: lab-postgres:14-poc
    pull_policy: never
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
      args:
        LOCAL_CUDA_IMAGE: ${LOCAL_CUDA_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'runuser -u postgres -- /usr/lib/postgresql/14/bin/pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [lab-net]

  backend:
    image: lab-backend:2026.10-poc
    pull_policy: never
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        LAB_BASE_IMAGE: ${LAB_BASE_IMAGE}
    environment: *app-env
    volumes:
      - ${LAB_HOST_ROOT}:/runtime
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health")']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [lab-net]

  scheduler-worker:
    image: lab-backend:2026.10-poc
    pull_policy: never
    command: [python3, -m, app.worker]
    environment: *app-env
    volumes:
      - ${LAB_HOST_ROOT}:/runtime
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [lab-net]

  frontend:
    image: lab-frontend:2026.10-poc
    pull_policy: never
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        LAB_BASE_IMAGE: ${LAB_BASE_IMAGE}
        LOCAL_NODE_IMAGE: ${LOCAL_NODE_IMAGE}
    restart: unless-stopped
    networks: [lab-net]

  traefik:
    image: lab-traefik:3.7.13-poc
    pull_policy: never
    build:
      context: .
      dockerfile: infra/traefik/Dockerfile
      args:
        LOCAL_CUDA_IMAGE: ${LOCAL_CUDA_IMAGE}
    ports:
      - '127.0.0.1:${PORTAL_PORT:-8080}:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [backend, frontend]
    restart: unless-stopped
    networks: [lab-net]

  gpu-monitor:
    image: ${LAB_BASE_IMAGE}
    pull_policy: never
    profiles: [gpu]
    entrypoint: [python3, /monitor.py]
    user: '${LAB_MONITOR_UID:-1000}:${LAB_MONITOR_GID:-1000}'
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
      NVIDIA_VISIBLE_DEVICES: all
      PYTHONPATH: /app
    gpus: all
    # NVML filters process lists by PID visibility. Hardware counters alone
    # cannot distinguish host jobs from platform allocations.
    pid: host
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes:
      - ./infra/gpu-monitor.py:/monitor.py:ro
      - ./backend/app/gpu_telemetry.py:/app/gpu_telemetry.py:ro
      - ${LAB_HOST_ROOT}/logs:/telemetry
    healthcheck:
      test: [CMD, python3, -c, 'import json,time,pathlib; p=pathlib.Path("/telemetry/gpu-telemetry.json"); assert time.time()-p.stat().st_mtime<15 and json.loads(p.read_text())["error"] is None']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [lab-net]

  host-editor-proxy:
    image: ${LAB_BASE_IMAGE}
    pull_policy: never
    profiles: [host]
    entrypoint: [/usr/lib/code-server/lib/node, /proxy.mjs]
    user: '${LAB_HOST_EDITOR_UID:-1000}:${LAB_HOST_EDITOR_GID:-1000}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes:
      - ./infra/host-editor-proxy.mjs:/proxy.mjs:ro
      - ${LAB_HOST_ROOT}/host-editor/run:/run/host-editor:ro
    labels:
      lab.project: gpu-lab-poc
      traefik.enable: 'true'
      traefik.docker.network: lab-net
      traefik.http.routers.host-editor.rule: 'Path(`/host`) || PathPrefix(`/host/`)'
      traefik.http.routers.host-editor.priority: '300'
      traefik.http.routers.host-editor.entrypoints: web
      traefik.http.routers.host-editor.middlewares: lab-auth@file,host-editor-strip
      traefik.http.middlewares.host-editor-strip.stripprefix.prefixes: /host
      traefik.http.services.host-editor.loadbalancer.server.port: '8080'
    healthcheck:
      test: [CMD, /usr/lib/code-server/lib/node, -e, 'fetch("http://127.0.0.1:8080/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [lab-net]

  cloudflared:
    image: ${CLOUDFLARED_IMAGE}
    pull_policy: never
    profiles: [remote]
    command: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:20241', --url, 'http://traefik:80']
    depends_on: [traefik]
    restart: unless-stopped
    networks: [lab-net]

networks:
  lab-net:
    name: lab-net
volumes:
  postgres-data:
